name: Resend concise housing LINE update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/resend_line.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: housing-line-preview
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -q
      - name: Send one concise LINE update
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_PUSH_TARGET_URL: https://kumamoto-home-track.onrender.com/push-target
        run: python line_notify.py
