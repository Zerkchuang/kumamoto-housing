name: Daily Kumamoto Housing Auto Crawler

on:
  push:
    branches: [main]
    paths:
      - 'crawler.py'
      - 'line_notify.py'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Multi-source Crawler
        run: python crawler.py

      - name: Send LINE notification
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python line_notify.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kumamoto_properties.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新：$(date +'%Y-%m-%d') 多來源房產資料" && git push)
