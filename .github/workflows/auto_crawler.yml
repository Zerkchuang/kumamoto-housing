name: Daily Kumamoto Housing Auto Crawler

on:
  schedule:
    # 每天 UTC 00:00 執行（即台灣時間 08:00 / 熊本時間 09:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Crawler
        run: |
          python crawler.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kumamoto_properties.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新：$(date +'%Y-%m-%d') 熊本房產與降價資料" && git push)
